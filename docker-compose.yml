services:

  db:
    image: postgres:17
    container_name: hackahunt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackahunt
      POSTGRES_PASSWORD: hackahunt_local_pw
      POSTGRES_DB: hackahunt
    ports:
      - "5435:5432"
    volumes:
      - hackahunt-pgdata:/var/lib/postgresql/data

volumes:
  hackahunt-pgdata:
